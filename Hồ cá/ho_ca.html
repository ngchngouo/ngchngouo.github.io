
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hồ Cá Vui Nhộn</title>

    <link rel="stylesheet" href="mystyle.css">
</head>

<body>
    <!--nhạc--> 
    <audio id="music" src="images/music.mp4" loop></audio>

    <script src="script.js"></script>

    <div id="content"> 

        <!--nút tắt mở--> 
        <div class="controls">
            <button id="musicBtn" onclick="toggleMusic()">
                🎵 Bật nhạc
            </button>
        </div>

       
        <div id="shark">
            <img src="images/shark.gif" alt="Cá mập">
        </div>

       
        <div id="turtle">
            <img src="images/turtle.gif" alt="Rùa biển">
        </div>

      
        <div id="diver1">
            <img src="images/diver1.webp" alt="Thợ lặn 1">
        </div>

        <div id="diver2">
            <img src="images/diver2.webp" alt="Thợ lặn 2">
        </div>

        <div id="diver3">
            <img src="images/diver3.gif" alt="Thợ lặn 3">
        </div>

        
        <div id="jellyfish1">
            <img src="images/jellyfish1.gif" alt="Sứa biển 1">
        </div>
        
        <div id="jellyfish2">
            <img src="images/jellyfish2.webp" alt="Sứa biển 2">
        </div>

      
        <div id="fish1">
            <img src="images/fish1.gif" alt="Cá nhỏ 1">
        </div>

        <div id="fish2">
            <img src="images/fish2.webp" alt="Cá nhỏ 2">
        </div>

        
        <div id="school1">
            <img src="images/fishschool1.gif" alt="Đàn cá 1">
        </div>

    </div>
</body>
</html>
